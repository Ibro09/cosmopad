[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"
# Non-secret identifiers and public on-chain configuration only.
# Keep database URIs, fee-recipient configuration, and other credentials out.
SECRETS_SCAN_OMIT_KEYS = "MONGODB_DB,VITE_PONS_V2_DEPLOYMENT_BLOCK,VITE_PONS_V2_LAUNCH_BUY_ROUTER,VITE_PONS_V2_PAIR_TOKEN,VITE_PONS_V2_CREATOR_TAX_BPS"

[functions]
node_bundler = "esbuild"
external_node_modules = ["express", "serverless-http", "mongodb", "viem"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
